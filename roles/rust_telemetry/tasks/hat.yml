---
- name: Keep HAT inference disabled while the Hailo safety latch is active
  ansible.builtin.systemd_service:
    name: rust-health-hat.service
    state: stopped
    masked: true
    daemon_reload: true
  when: >-
    rust_telemetry_hailo_disabled.stat.exists or
    rust_telemetry_hailo_policy.stat.exists

- name: Explain why HAT inference deployment is skipped
  ansible.builtin.debug:
    msg: >-
      HAT inference remains stopped and masked because the persistent Hailo
      safety latch is active. The inference toggle cannot clear that latch.
  when: >-
    rust_telemetry_hailo_disabled.stat.exists or
    rust_telemetry_hailo_policy.stat.exists

- name: Configure HAT inference only while Hailo is enabled
  ansible.builtin.include_tasks: hat-provision.yml
  when: >-
    not rust_telemetry_hailo_disabled.stat.exists and
    not rust_telemetry_hailo_policy.stat.exists
