---
rust_telemetry_port: 8090
rust_telemetry_desktop_autostart: false
rust_telemetry_desktop_user: ''
rust_telemetry_show_names: true
rust_telemetry_player_names: {} # Optional private SteamID-to-display-name mapping.
rust_telemetry_check_schedule: '*-*-* 03,15:30:00'
rust_telemetry_fex: "{{ fex_prefix | default('/usr') }}/bin/FEX"
rust_telemetry_rootfs: "{{ fex_rootfs_path | default('/opt/fex/rootfs/ubuntu-24.04-2026-08-11') }}"
rust_telemetry_fex_version: "{{ fex_version | default('FEX-2609-120-ge2f973fe9') }}"
# Local, append-only sample archive used for later offline analysis. Never leaves the Pi.
rust_telemetry_feature_capture: true
rust_telemetry_feature_retain_days: 90
rust_telemetry_feature_max_mib: 256 # Hard ceiling; the Rust world shares this 32 GB volume.
