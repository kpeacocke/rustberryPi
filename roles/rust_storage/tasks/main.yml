---
- name: Install storage safety inspector
  ansible.builtin.copy:
    src: storage.py
    dest: /usr/local/libexec/pi5-rust/storage.py
    mode: '0755'

- name: Inspect or explicitly initialize storage
  ansible.builtin.command:
    argv:
      - python3
      - /usr/local/libexec/pi5-rust/storage.py
      - "{{ rust_storage_label }}"
      - "{{ rust_storage_uuid }}"
      - "{{ rust_storage_device }}"
      - "{{ rust_storage_initialise | bool | ternary('yes', 'no') }}"
  register: rust_storage_probe
  changed_when: (rust_storage_probe.stdout | from_json).formatted

- name: Save verified UUID
  ansible.builtin.set_fact:
    rust_storage_verified_uuid: "{{ (rust_storage_probe.stdout | from_json).uuid }}"

- name: Mount persistent filesystem with one fstab entry
  ansible.posix.mount:
    path: /srv/rust
    src: "UUID={{ rust_storage_verified_uuid }}"
    fstype: ext4
    opts: defaults,noatime
    dump: '0'
    passno: '2'
    state: mounted

- name: Verify mounted UUID
  ansible.builtin.command: findmnt -n -o UUID --mountpoint /srv/rust
  register: rust_storage_mount
  changed_when: false
  failed_when: rust_storage_mount.stdout != rust_storage_verified_uuid

- name: Inspect existing Rust account
  ansible.builtin.getent:
    database: passwd
    key: rust
    fail_key: false

- name: Inspect existing Rust group
  ansible.builtin.getent:
    database: group
    key: rust
    fail_key: false

- name: Inspect persistent ownership before creating accounts
  ansible.builtin.stat:
    path: /srv/rust/home
    follow: false
  register: rust_storage_home

- name: Select stable GID from explicit setting or existing account and disk
  ansible.builtin.set_fact:
    rust_storage_gid: >-
      {{ rust_gid | default(ansible_facts.getent_group['rust'][1]
         if ansible_facts.getent_group['rust'] else
         (rust_storage_home.stat.gid if rust_storage_home.stat.exists else rust_uid)) | int }}

- name: Refuse implicit ownership migrations
  ansible.builtin.assert:
    that:
      - rust_uid | int >= 1000
      - rust_storage_gid | int >= 1000
      - not ansible_facts.getent_passwd['rust'] or ansible_facts.getent_passwd['rust'][1] | int == rust_uid | int
      - not ansible_facts.getent_group['rust'] or ansible_facts.getent_group['rust'][1] | int == rust_storage_gid | int
      - not rust_storage_home.stat.exists or rust_storage_home.stat.uid == rust_uid | int
      - not rust_storage_home.stat.exists or rust_storage_home.stat.gid == rust_storage_gid | int
    fail_msg: Existing account or USB ownership differs. Preserve its numeric UID/GID in private vars; do not recursively chown blindly.

- name: Create stable Rust group
  ansible.builtin.group:
    name: rust
    gid: "{{ rust_storage_gid }}"

- name: Create stable Rust account
  ansible.builtin.user:
    name: rust
    uid: "{{ rust_uid }}"
    group: rust
    password_lock: true
    home: /srv/rust/home
    create_home: false
    shell: /usr/sbin/nologin

- name: Create persistent layout
  ansible.builtin.file:
    path: "/srv/rust/{{ item }}"
    state: directory
    owner: rust
    group: rust
    mode: '0750'
  loop: [home, steamcmd, server, data]

- name: Prepare private Ansible temporary directories for the Rust account
  ansible.builtin.file:
    path: "/srv/rust/home/{{ item }}"
    state: directory
    owner: rust
    group: rust
    mode: '0700'
  loop: [.ansible, .ansible/tmp]
