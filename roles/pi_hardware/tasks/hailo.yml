---
- name: Read persistent Hailo safety latch before provisioning
  ansible.builtin.stat:
    path: /var/lib/rustberrypi-hailo/disabled
  register: pi_hardware_hailo_disabled

- name: Read persistent Hailo modprobe safety policy
  ansible.builtin.stat:
    path: /etc/modprobe.d/rustberrypi-hailo-disabled.conf
  register: pi_hardware_hailo_policy

- name: Reject an unsafe Hailo safety-latch path
  ansible.builtin.assert:
    that:
      - not pi_hardware_hailo_disabled.stat.islnk | default(false)
      - not pi_hardware_hailo_policy.stat.islnk | default(false)
    fail_msg: A Hailo safety-policy path is a symlink; refusing provisioning.

- name: Explicitly skip Hailo provisioning while safety-disabled
  ansible.builtin.debug:
    msg: >-
      Hailo provisioning is skipped because the persistent safety latch is
      active. Use the Hailo control workflow to explicitly enable hardware.
  when: >-
    pi_hardware_hailo_disabled.stat.exists or
    pi_hardware_hailo_policy.stat.exists

- name: Provision Hailo when not safety-disabled
  ansible.builtin.include_tasks: hailo-provision.yml
  when: >-
    not pi_hardware_hailo_disabled.stat.exists and
    not pi_hardware_hailo_policy.stat.exists
