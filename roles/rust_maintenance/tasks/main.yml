---
- name: Validate requested maintenance window
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - rust_maintenance_target in ['os', 'fex', 'rust', 'os-rust', 'all', 'hailo']
      - rust_maintenance_warning_seconds | int >= 0
      - rust_maintenance_warning_seconds | int <= 3600
      - rust_maintenance_health_timeout | int >= 60
      - ansible_facts['distribution'] == 'Debian'
      - >-
        rust_maintenance_target not in ['os', 'os-rust', 'all'] or not rust_maintenance_os_reboot | bool
        or ansible_connection | default('ssh') != 'local'
      - >-
        rust_maintenance_target not in ['fex', 'all'] or
        (rust_maintenance_fex_commit is match('^[a-f0-9]{40}$') and
        rust_maintenance_fex_version is match('^[A-Za-z0-9._-]+$'))
    fail_msg: >-
      Choose os, fex, rust, os-rust, all or hailo. FEX requires an explicit commit and version.
      Hailo requires private firmware EULA approval; standalone Hailo also requires a ready local candidate.
      Rebooting OS jobs require an SSH controller;
      local jobs must set rust_maintenance_os_reboot=false.

- name: Install Hailo safety controller for maintenance preflight
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../tools/hailo_install.py'
    dest: /usr/local/libexec/rustberrypi-hailo-install.py
    owner: root
    group: root
    mode: '0750'
  when: rust_maintenance_target in ['all', 'hailo']

- name: Read persistent Hailo safety state before maintenance
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/rustberrypi-hailo-install.py
      - --control
      - status
  register: rust_maintenance_hailo_control
  changed_when: false
  when: rust_maintenance_target in ['all', 'hailo']

- name: Require readable Hailo safety state
  ansible.builtin.assert:
    that: (rust_maintenance_hailo_control.stdout | from_json).state != 'failure'
    fail_msg: >-
      Hailo safety status is inconsistent or unreadable; refusing maintenance.
      Inspect the Hailo control workflow before continuing.
  when: rust_maintenance_target in ['all', 'hailo']

- name: Remember persistent Hailo safety latch
  ansible.builtin.set_fact:
    rust_maintenance_hailo_disabled: >-
      {{ (rust_maintenance_hailo_control.stdout | from_json).disabled | bool }}
  when: rust_maintenance_target in ['all', 'hailo']

- name: Refuse ordinary Hailo activation while safety-disabled
  ansible.builtin.assert:
    that: not rust_maintenance_hailo_disabled | bool
    fail_msg: >-
      Hailo maintenance cannot clear the persistent safety latch. Use the
      explicit Hailo control action; All deliberately skips Hailo while disabled.
  when: rust_maintenance_target == 'hailo'

- name: Install existing read-only peripheral detector for All
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../roles/pi_hardware/files/detect.py'
    dest: /usr/local/libexec/rustberrypi-detect-hardware.py
    owner: root
    group: root
    mode: '0755'
  when: rust_maintenance_target == 'all'

- name: Detect Hailo PCI hardware without provisioning or enabling inference
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/libexec/rustberrypi-detect-hardware.py]
  register: rust_maintenance_hardware
  changed_when: false
  when: rust_maintenance_target == 'all'

- name: Remember whether All includes detected Hailo hardware
  ansible.builtin.set_fact:
    rust_maintenance_all_hailo: >-
      {{ rust_maintenance_target == 'all' and
         not rust_maintenance_hailo_disabled | bool and
         (rust_maintenance_hardware.stdout | from_json).hailo | length > 0 }}

- name: Require Hailo approval and valid version before downtime
  ansible.builtin.assert:
    that:
      - rust_maintenance_hailo_firmware_eula_accepted | bool
      - rust_maintenance_hailo_version == '' or rust_maintenance_hailo_version is match('^4\.[0-9]+\.[0-9]+$')
    fail_msg: Hailo maintenance requires private firmware EULA approval and an optional exact stable 4.x version.
  when: rust_maintenance_target == 'hailo' or rust_maintenance_all_hailo | bool

- name: Explicitly skip Hailo for All while safety-disabled
  ansible.builtin.debug:
    msg: >-
      Hailo is deliberately skipped because the persistent safety latch is
      active, regardless of PCI hardware or rust_telemetry_hat_enabled.
  when:
    - rust_maintenance_target == 'all'
    - rust_maintenance_hailo_disabled | bool

- name: Explicitly skip Hailo for All on non-HAT hosts
  ansible.builtin.debug:
    msg: All includes OS, FEX and Rust only; no Hailo PCI hardware was detected, so Hailo is skipped.
  when:
    - rust_maintenance_target == 'all'
    - not rust_maintenance_hailo_disabled | bool
    - not rust_maintenance_all_hailo | bool

- name: Validate detected Hailo host platform before downtime
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] == 'aarch64'
      - ansible_facts['distribution_major_version'] == '13'
    fail_msg: All Hailo source builds require a previously provisioned Debian 13 arm64 HAT host.
  when: rust_maintenance_all_hailo | bool

- name: Install release selector before All downtime
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../tools/hailo_candidate.py'
    dest: /usr/local/libexec/rustberrypi-hailo-candidate.py
    owner: root
    group: root
    mode: '0750'
  when: rust_maintenance_all_hailo | bool

- name: Validate and pin common stable Hailo release before All downtime
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '/usr/local/libexec/rustberrypi-hailo-candidate.py',
          '--firmware-eula-accepted', '--select-release'] +
         (['--version', rust_maintenance_hailo_version] if rust_maintenance_hailo_version | length > 0 else []) }}
  register: rust_maintenance_hailo_release
  changed_when: false
  when: rust_maintenance_all_hailo | bool

- name: Remember approved release across OS reboot
  ansible.builtin.set_fact:
    rust_maintenance_hailo_release_version: '{{ rust_maintenance_hailo_release.stdout | trim }}'
  when: rust_maintenance_all_hailo | bool

- name: Install candidate validator before announcing downtime
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../tools/hailo_install.py'
    dest: /usr/local/libexec/rustberrypi-hailo-install.py
    owner: root
    group: root
    mode: '0750'
  when: rust_maintenance_target == 'hailo' or rust_maintenance_all_hailo | bool

- name: Select and validate a ready Hailo candidate before downtime
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/python3', '/usr/local/libexec/rustberrypi-hailo-install.py', '--select'] +
         ([rust_maintenance_hailo_version] if rust_maintenance_hailo_version | length > 0 else []) }}
  register: rust_maintenance_hailo_selection
  changed_when: false
  when: rust_maintenance_target == 'hailo'

- name: Remember the exact validated candidate for this maintenance window
  ansible.builtin.set_fact:
    rust_maintenance_hailo_selected_version: '{{ rust_maintenance_hailo_selection.stdout | trim }}'
  when: rust_maintenance_target == 'hailo'

- name: Verify approved Hailo candidate exists before downtime
  ansible.builtin.stat:
    path: '/var/lib/rustberrypi-hailo/candidates/{{ rust_maintenance_hailo_selected_version }}/READY'
  register: rust_maintenance_hailo_candidate
  when: rust_maintenance_target == 'hailo'

- name: Require completed Hailo candidate before downtime
  ansible.builtin.assert:
    that: rust_maintenance_hailo_candidate.stat.isreg | default(false)
    fail_msg: >-
      Build the selected candidate with playbooks/hailo-candidate.yml before
      launching Hailo maintenance.
  when: rust_maintenance_target == 'hailo'

- name: Install maintenance control utility
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../maintenance/control.py'
    dest: /usr/local/libexec/pi5-rust/maintenance.py
    owner: root
    group: root
    mode: '0750'

- name: Inspect existing managed installation
  ansible.builtin.command: /usr/bin/python3 /usr/local/libexec/pi5-rust/maintenance.py inspect
  register: rust_maintenance_inspection
  changed_when: false

- name: Remember deployed runtime rather than changing unrelated pins
  ansible.builtin.set_fact:
    rust_maintenance_runtime: '{{ rust_maintenance_inspection.stdout | from_json }}'

- name: Verify NAS is mounted before announcing downtime
  ansible.builtin.command:
    argv: [mountpoint, -q, '{{ rust_backup_mount }}']
  changed_when: false

- name: Require a running game before a scheduled maintenance window # noqa: command-instead-of-module -- Read-only state check.
  ansible.builtin.command: systemctl is-active --quiet rust.service
  changed_when: false

- name: Record initial service and timer states
  ansible.builtin.command:
    argv: [systemctl, show, '{{ item }}', '--property=ActiveState', --value]
  loop: [rust-backup.timer, rust-maintenance-check.timer, rust-telemetry.service, rust-health-hat.service, rust-watchdog.timer]
  register: rust_maintenance_initial_units
  changed_when: false
  failed_when: false

- name: Acquire exclusive maintenance window
  ansible.builtin.command: mkdir -m 0700 /var/lib/rustberrypi-maintenance
  changed_when: true
  # Atomic acquisition intentionally fails if another or interrupted job owns it.

- name: Execute selected jobs inside one maintenance window
  block:
    - name: Wait for existing Hailo candidate work before announcing downtime
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/rustberrypi-hailo-install.py, --quiesce]
      async: 21660
      poll: 30
      changed_when: false
      when: rust_maintenance_target == 'hailo' or rust_maintenance_all_hailo | bool

    - name: Create service guard directories
      ansible.builtin.file:
        path: '/etc/systemd/system/{{ item }}.d'
        state: directory
        mode: '0755'
      loop: [rust.service, rust-backup.service, rust-maintenance-check.service]

    - name: Prevent unattended starts during offline work including after reboot
      ansible.builtin.copy:
        content: |
          [Unit]
          ConditionPathExists=!/var/lib/rustberrypi-maintenance/offline
        dest: '/etc/systemd/system/{{ item }}.d/maintenance-guard.conf'
        mode: '0644'
      loop: [rust.service, rust-backup.service, rust-maintenance-check.service]

    - name: Pause scheduled jobs and collector while maintenance owns RCON
      ansible.builtin.systemd_service:
        name: '{{ item.item }}'
        state: stopped
        daemon_reload: true
      loop: '{{ rust_maintenance_initial_units.results }}'
      loop_control:
        label: '{{ item.item }}'
      when: item.rc == 0

    - name: Wait for already running scheduled operations
      ansible.builtin.command:
        argv: [systemctl, show, '{{ item }}', '--property=ActiveState', --value]
      register: rust_maintenance_background
      changed_when: false
      until: rust_maintenance_background.stdout in ['inactive', 'failed']
      retries: 120
      delay: 10
      loop: [rust-backup.service, rust-maintenance-check.service, rust-watchdog.service]

    - name: Allow a quiet RCON interval before announcing maintenance
      ansible.builtin.pause:
        seconds: 60

    - name: Announce countdown and request world save
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/pi5-rust/maintenance.py
          - announce
          - --seconds
          - '{{ rust_maintenance_warning_seconds | int }}'
          - --jobs
          - '{{ rust_maintenance_target }}'
      async: 3700
      poll: 10
      changed_when: true

    - name: Mark offline phase persistently
      ansible.builtin.copy:
        content: 'Maintenance in progress; see maintenance/README.md for interrupted-job recovery.'
        dest: /var/lib/rustberrypi-maintenance/offline
        mode: '0600'

    - name: Stop Rust gracefully under the existing lifecycle lock
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/pi5-rust/service_state.py, stop]
      changed_when: true

    - name: Require clean shutdown before changing files # noqa: command-instead-of-module -- Read-only Result check.
      ansible.builtin.command: systemctl show rust.service --property=Result --value
      register: rust_maintenance_shutdown
      changed_when: false
      failed_when: rust_maintenance_shutdown.stdout != 'success'

    - name: Create consistent NAS archive with existing backup safeguards
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - /usr/local/libexec/pi5-rust/backup.py
          - backup
          - --mount
          - '{{ rust_backup_mount }}'
          - --destination
          - '{{ rust_backup_destination }}'
      register: rust_maintenance_backup
      async: 3600
      poll: 10
      changed_when: true

    - name: Verify new archive checksum and read all archived files
      ansible.builtin.command:
        argv: [/usr/bin/python3, /usr/local/libexec/pi5-rust/maintenance.py, verify-backup,
               --archive, '{{ rust_maintenance_backup.stdout | trim }}']
      changed_when: false

    - name: Run OS job
      ansible.builtin.include_tasks: os.yml
      when: rust_maintenance_target in ['os', 'os-rust', 'all']

    - name: Run pinned FEX job
      ansible.builtin.include_tasks: fex.yml
      when: rust_maintenance_target in ['fex', 'all']

    - name: Run Rust job
      ansible.builtin.include_tasks: rust.yml
      when: rust_maintenance_target in ['rust', 'os-rust', 'all']

    - name: Activate approved Hailo source candidate
      ansible.builtin.include_tasks: hailo.yml
      when: rust_maintenance_target == 'hailo' or rust_maintenance_all_hailo | bool

    - name: Require 4 KB kernel pages after maintenance
      ansible.builtin.command: getconf PAGESIZE
      register: rust_maintenance_pages
      changed_when: false
      failed_when: rust_maintenance_pages.stdout | trim != '4096'

    - name: Allow controlled startup for health checks
      ansible.builtin.file:
        path: /var/lib/rustberrypi-maintenance/offline
        state: absent

    - name: Start Rust under lifecycle lock
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/pi5-rust/service_state.py, start]
      changed_when: true

    - name: Verify game-query readiness
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/pi5-rust/health.py, '{{ rust_maintenance_health_timeout | int }}']
      async: '{{ rust_maintenance_health_timeout | int + 30 }}'
      poll: 10
      changed_when: false
      no_log: true  # Existing health helper includes raw game logs on failure.

    - name: Restart collector after maintenance
      ansible.builtin.systemd_service:
        name: rust-telemetry.service
        state: restarted

    - name: Wait for fresh RCON data
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ rust_maintenance_runtime.telemetry_port }}/api/status'
        return_content: true
      register: rust_maintenance_health
      until: >-
        rust_maintenance_health.status | default(0) == 200 and
        rust_maintenance_health.json.rcon_at | default(0) > rust_maintenance_health.json.sampled_at | default(0) - 30 and
        rust_maintenance_health.json.rcon_at | default(0) > 0 and
        not rust_maintenance_health.json.rcon_error | default(true)
      retries: 120
      delay: 5
      no_log: true  # Player names are not published in AWX output.

    - name: Read automatic restart count after verified recovery
      ansible.builtin.command:
        argv: [systemctl, show, rust.service, '--property=NRestarts', --value]
      register: rust_maintenance_verified_restarts
      changed_when: false

    - name: Clear reviewed restart history after successful maintenance # noqa: command-instead-of-module -- No module operation for reset-failed.
      ansible.builtin.command:
        argv: [systemctl, reset-failed, rust.service]
      when: rust_maintenance_verified_restarts.stdout | trim | int > 0
      changed_when: true

    - name: Read Pi time for verified maintenance evidence
      ansible.builtin.command: date +%s
      register: rust_maintenance_completed_at
      changed_when: false

    - name: Record verified maintenance for performance comparison
      ansible.builtin.copy:
        content: >-
          {{ {'version': 1, 'completed_at': rust_maintenance_completed_at.stdout | trim | int,
              'target': rust_maintenance_target} | to_nice_json }}
        dest: /var/lib/rustberrypi/server-health-maintenance.json
        owner: root
        group: root
        mode: '0644'
      when: rust_maintenance_hailo_install.rc | default(0) != 10

    - name: Report verified completion
      ansible.builtin.debug:
        msg: >-
          Maintenance {{ rust_maintenance_target }} recovered; game query and authenticated RCON are healthy.
          Dashboard evidence refresh follows after releasing the maintenance window.
          Backup {{ rust_maintenance_backup.stdout | trim }}.
      when: rust_maintenance_hailo_install.rc | default(0) != 10

    - name: Report game recovery without claiming a successful Hailo upgrade
      ansible.builtin.debug:
        msg: Rust recovered and backup verified, but Hailo activation was rolled back; this job will fail after board refresh.
      when: rust_maintenance_hailo_install.rc | default(0) == 10

    - name: Release completed maintenance window
      ansible.builtin.file:
        path: /var/lib/rustberrypi-maintenance
        state: absent

  rescue:
    - name: Record whether offline work began
      ansible.builtin.stat:
        path: /var/lib/rustberrypi-maintenance/offline
      register: rust_maintenance_offline_marker

    - name: Guard failed update or failed startup from automatic restart
      when: rust_maintenance_backup is defined or rust_maintenance_offline_marker.stat.exists
      block:
        - name: Retain persistent startup guard
          ansible.builtin.copy:
            content: 'Maintenance failed; inspect job output and follow documented recovery.'
            dest: /var/lib/rustberrypi-maintenance/offline
            mode: '0600'
        - name: Leave failed deployment stopped
          ansible.builtin.systemd_service:
            name: rust.service
            state: stopped

    - name: Release window if failure happened before offline work
      ansible.builtin.file:
        path: /var/lib/rustberrypi-maintenance
        state: absent
      when:
        - rust_maintenance_backup is not defined
        - not rust_maintenance_offline_marker.stat.exists

    - name: Report failure without implying rollback or success
      ansible.builtin.fail:
        msg: >-
          Maintenance failed at {{ ansible_failed_task.name }}. No automatic rollback was attempted.
          If offline work began, Rust remains stopped with a persistent startup guard.
          Follow maintenance/README.md; preserve the new NAS backup and job output.

  always:
    - name: Restore previously running timers and collector
      ansible.builtin.systemd_service:
        name: '{{ item.item }}'
        state: started
      loop: '{{ rust_maintenance_initial_units.results }}'
      loop_control:
        label: '{{ item.item }}'
      when:
        - item.rc == 0
        - item.stdout == 'active'

- name: Refresh maintenance boards after successful maintenance
  ansible.builtin.include_role:
    name: rust_maintenance_refresh

- name: Report Hailo rollback as unsuccessful maintenance after game recovery
  ansible.builtin.fail:
    msg: >-
      Rust recovered, but Hailo activation failed and was rolled back.
      Review the hardware-validation error in the job output; Hailo was not upgraded.
  when: rust_maintenance_hailo_install.rc | default(0) == 10

- name: Report maintenance and dashboard refresh completion
  ansible.builtin.debug:
    msg: >-
      Maintenance {{ rust_maintenance_target }} complete; telemetry was restarted,
      game recovery verified and dashboard update checks refreshed.
