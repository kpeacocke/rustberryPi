---
- name: Converge Raspberry Pi Rust server
  hosts: rust_servers
  become: true
  pre_tasks:
    - name: Require a real convergence run for hardware-dependent probes
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use syntax-check and the documented read-only preflight; full check mode cannot simulate mounts or FEX.
    - name: Require firewall collection on the execution worker before touching Rust
      ansible.builtin.command:
        argv: [ansible-doc, -t, module, community.general.ufw]
      delegate_to: localhost
      become: false
      run_once: true
      register: rust_firewall_module
      changed_when: false
      failed_when: rust_firewall_module.rc != 0 or not (rust_firewall_module.stdout | trim)
      when: rust_manage_firewall | bool
  roles:
    - automation_account
    - prerequisites
    - rust_hostname
    - raspberry_pi
    - rust_storage
    - fex
    - steamcmd
    - rust_server
    - role: rust_nas
      when: rust_nas_enabled | default(false) | bool
    - rust_backup
    - role: rust_telemetry
      when: rust_telemetry_enabled | default(false) | bool
    - rust_watchdog
    - validation
