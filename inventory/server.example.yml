---
# NEW servers only: copy into ignored host_vars/<alias>/settings.yml and edit.
# Existing installations must preserve their current identity and numeric IDs.
rust_identity: rustberry
# The server name and description default to inventory/descriptions/rustpi-*.txt.
# Override rust_hostname or rust_description here only for a host-specific value.
# rust_headerimage: "https://example.org/rust-banner.png"  # Direct 512x256 JPG/PNG.
# rust_logoimage: "https://example.org/rust-logo.png"  # Direct square JPG/PNG.
# rust_url: "https://example.org/rust"
# rust_saveinterval: 300  # Seconds between automatic world saves.
rust_uid: 2001
# rust_gid: 2001  # Optional; existing account/disk GID is adopted if omitted.
rust_worldsize: 1500
rust_seed: 12345
rust_maxplayers: 4
rust_storage_label: RUSTSERVER
rust_storage_uuid: ""  # Prefer the actual filesystem UUID from lsblk -f.
rust_manage_firewall: false
rust_ssh_allowed_networks: []  # Fill in your trusted LAN/VPN networks before enabling.
rust_plus_enabled: false
# fex_existing_rootfs: /absolute/path/to/manual/Ubuntu_24_04

# Optional local-only dashboards; first enablement restarts Rust for local RCON.
rust_telemetry_enabled: false
rust_telemetry_show_names: true
