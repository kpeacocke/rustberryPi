---
name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  ANSIBLE_INVENTORY: inventory/hosts.yml
jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        requirements: [requirements-dev.txt, awx/requirements-compat.txt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install controller tools
        run: pip install -r '${{ matrix.requirements }}'
      - name: Install pinned collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Lint
        run: ansible-lint
      - name: Check playbooks
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook "$playbook" --syntax-check
          done
      - name: Test safety and protocol helpers
        run: python -m unittest discover -s tests -v
